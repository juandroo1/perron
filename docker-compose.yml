name: perron

services:
  mcp:
    build:
      context: .
      dockerfile: src/Perron.Mcp/Dockerfile
    image: perron-mcp:dev
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # No curl/wget in the runtime image; the server ships its own probe.
      test: ["CMD", "dotnet", "Perron.Mcp.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

  bench:
    profiles: ["bench"]
    build:
      context: .
      dockerfile: src/Perron.Bench/Dockerfile
    image: perron-bench:dev
    env_file:
      - path: .env
        required: false
    depends_on:
      mcp:
        condition: service_healthy
